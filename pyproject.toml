[project]
name = "leadflow-backend"
version = "0.1.0"
description = "LeadFlow CRM API"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-sslserver-v2>=1.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
