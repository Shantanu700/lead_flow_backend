# Development stack. Run from the backend root, after `cp .env.example .env`:
#   docker compose -f docker/dev/docker-compose.yml up -d --build
#
# Brings up its own Postgres and Redis. `web` creates the database, runs the
# migrations, seeds sample data into an empty database and starts the HTTPS dev
# server on https://localhost:8011 (see start.sh). App settings are NOT injected
# here: Django reads the bind-mounted backend/.env itself, so editing it only
# reloads the process, never the container.
name: leadflow-dev

x-app: &app
  build:
    context: ../..
    dockerfile: docker/dev/Dockerfile
    args:
      # Matches the host user so files written into the bind mount stay yours.
      USER: ${USER:-leadflow}
  # One image for web/worker/beat so they never drift apart.
  image: leadflow:dev
  volumes:
    # Only the code is mounted; host secrets such as ~/.ssh stay out.
    - ../..:/backend
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  web:
    <<: *app
    container_name: leadflow_dev_web
    # Sets up the database and serves https://localhost:8011. For commands,
    # `docker exec -it leadflow_dev_web zsh`; plain `runserver 0.0.0.0:8000`
    # started there serves http://localhost:8010.
    command: sh docker/dev/start.sh
    ports: ["8010:8000", "8011:8001"]

  worker:
    <<: *app
    container_name: leadflow_dev_worker
    # watchfiles restarts Celery when app code or .env changes.
    command: watchfiles "celery -A config worker -l info --concurrency 2" . --ignore-paths .venv,.git,tests,docker,staticfiles,media

  beat:
    <<: *app
    container_name: leadflow_dev_beat
    command: watchfiles "celery -A config beat -l info" . --ignore-paths .venv,.git,tests,docker,staticfiles,media

  postgres:
    image: postgres:17
    container_name: leadflow_dev_postgres
    # Dev-only superuser; create_database uses it (DATABASE_ADMIN_URL) to make
    # the app's own role and database.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    # 5433 on the host, so it never clashes with another local Postgres.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8
    container_name: leadflow_dev_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
